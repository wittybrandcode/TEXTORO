name: smoke
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run smoke checks
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/smoke/run-smoke-checks.ps1
